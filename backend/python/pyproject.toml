[project]
name = "ecoorigem"
version = "1.0.0"
description = "Rastreabilidade de produtos da bioeconomia amazônica com blockchain local em Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:ecoorigem"]

[tool.coverage.run]
source = ["ecoorigem"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pylint.main]
py-version = "3.10"
jobs = 0

[tool.pylint.basic]
no-docstring-rgx = "^(_|test_)"
good-names = ["i", "j", "k", "ex", "_", "tx", "db"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-attributes = 12
min-public-methods = 1

[tool.pylint."messages control"]
disable = ["fixme"]
